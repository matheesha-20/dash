name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main # ඔයාගේ default branch එක master නම් 'master' කරන්න

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java Setup කිරීම (Flutter Web වලට අවශ්‍යයි)
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Flutter Setup කිරීම
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. Dependencies Get කිරීම සහ Web Build එක සෑදීම
      - run: flutter pub get
      - run: flutter build web --release

      # 4. Firebase Hosting එකට Deploy කිරීම
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DASH_CHATAPP }}' # <--- මෙතන ඔයාගේ Secret Key එකේ නම තිබිය යුතුය
          channelId: live
          projectId: dash # <--- මෙතන ඔයාගේ Firebase Project ID එක තිබිය යුතුය