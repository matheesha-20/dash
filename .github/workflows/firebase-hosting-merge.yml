# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Flutter Setup කිරීම (මේ කොටස නැති නිසා තමයි Build එක Fail වෙන්නේ)
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 2. Web Build එක සෑදීම
      - run: flutter build web --release

      # 3. Firebase එකට Deploy කිරීම
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DASH_CHATAPP }}'
          channelId: live
          projectId: dash-chatapp
